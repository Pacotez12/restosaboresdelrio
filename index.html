<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabores del Río | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-mode">

<!-- ===== LOGIN ===== -->
<div id="view-login" class="view active">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🌊</div>
      <h1 class="login-title">Sabores del Río</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" class="search-input" placeholder="Tu usuario" required>
        </div>
        <div class="form-group" style="margin-top: 15px;">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="search-input" placeholder="••••••••" required>
        </div>
        <div id="login-error" class="login-error" style="display: none;">Credenciales incorrectas</div>
        <button type="submit" class="btn btn-primary" style="margin-top: 25px; width: 100%;">Entrar</button>
      </form>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
