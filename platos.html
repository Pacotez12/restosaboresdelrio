<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platos | Sabores del Río</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <span class="logo-wave">🌊</span>
    Sabores <em>del Río</em>
  </div>
  <div class="topbar-right">
    <span id="user-info" style="font-size: 13px; color: var(--muted); margin-right: 15px; font-weight: 500;"></span>
    <span class="clock" id="clock">--:--</span>
    <span class="badge" id="notif-badge">0 pendientes</span>
    <button class="btn btn-secondary" onclick="logout()" style="width: auto; padding: 5px 12px; margin-left: 15px; font-size: 12px; border-color: transparent;">Salir</button>
  </div>
</div>

<div class="reportes-layout">
  <div class="reportes-header">
    <div>
      <div class="rep-title">Platos del Menú</div>
      <div style="color:var(--muted);font-size:12px;margin-top:3px;">Gestión de la carta, precios y categorías</div>
    </div>
    <div>
      <button class="btn btn-primary" style="width:auto;padding:9px 18px;margin-top:0;" onclick="abrirCrearPlato()">+ Nuevo Plato</button>
    </div>
  </div>

  <div style="margin-bottom: 16px; max-width: 320px;">
    <input class="search-input" type="text" placeholder="🔍 Buscar plato por nombre o categoría..." id="plato-search-input" oninput="filterPlatos()">
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Emoji</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Categoría</th>
          <th>Estado</th>
          <th style="text-align: right;">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-platos-body">
        <!-- Platos listados dinámicamente -->
      </tbody>
    </table>
  </div>
</div>

<!-- Modal de Formulario -->
<div class="modal-overlay" id="form-modal-overlay">
  <div class="modal" style="max-width: 450px;">
    <div class="modal-title" id="plato-modal-title">Crear Plato</div>
    <div class="modal-sub" id="plato-modal-sub">Completa los datos del plato/bebida</div>
    
    <form id="plato-form" onsubmit="guardarPlato(event)">
      <input type="hidden" id="edit-plato-id">
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="plato-emoji" style="font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px;">Emoji ilustrativo</label>
        <input type="text" id="plato-emoji" class="search-input" style="width: 100%; box-sizing: border-box;" required placeholder="Ej. 🐟" maxlength="4">
      </div>
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="plato-nombre" style="font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px;">Nombre del Plato</label>
        <input type="text" id="plato-nombre" class="search-input" style="width: 100%; box-sizing: border-box;" required placeholder="Ej. Dorado a las Brasas">
      </div>
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="plato-precio" style="font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px;">Precio (Gs.)</label>
        <input type="number" id="plato-precio" class="search-input" style="width: 100%; box-sizing: border-box;" required placeholder="Ej. 75000">
      </div>
      <div class="form-group" style="margin-bottom: 12px;">
        <label for="plato-categoria" style="font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px;">Categoría</label>
        <select id="plato-categoria" class="rep-select" style="width: 100%; box-sizing: border-box; height: 38px;" required>
          <!-- Categorías listadas dinámicamente -->
        </select>
      </div>
      <div class="form-group" style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="plato-activo" style="width: 16px; height: 16px; accent-color: var(--accent);">
        <label for="plato-activo" style="font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;">Plato Activo (Disponible)</label>
      </div>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button type="button" class="btn btn-secondary" onclick="cerrarPlatoModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="plato-submit-btn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal de Confirmación -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Confirmar</div>
    <div class="modal-sub" id="modal-sub">¿Estás seguro?</div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()" style="margin-top:0;">Cancelar</button>
      <button class="btn btn-primary" id="modal-confirm-btn" style="margin-top:0;">Confirmar</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
